# commit-msg is installed beside pre-commit so `prek install` (and
# `just hooks-install-all`) also checks the commit message.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without `stages` stay pre-commit only; otherwise every hook would
# also run against the commit message file.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Every commit message is a Conventional Commit (owner, 2026-10-09).
      # Vendored unchanged from airdress-ops (`just conventional-commit-vendor`).
      - id: conventional-commit
        name: conventional commit message
        entry: python3 scripts/check-conventional-commit.py
        language: system
        stages: [commit-msg]

      - id: conventional-commit-tests
        name: conventional commit checker tests
        entry: python3 -m unittest discover -s scripts -p test_check_conventional_commit.py
        language: system
        pass_filenames: false
        files: ^scripts/(check-conventional-commit|test_check_conventional_commit)\.py$

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

      - id: lints-copy
        name: the FFI crate's lints are the workspace's
        entry: scripts/check-lints-copy.sh
        language: system
        files: Cargo\.toml$
        pass_filenames: false

      - id: public-hygiene
        name: no internal names in a public repository
        entry: scripts/check-public.sh
        language: system
        pass_filenames: false

      - id: doc-numbers
        name: document numbers stay out of code
        entry: scripts/check-doc-numbers.sh
        language: system
        pass_filenames: false

      - id: third-party
        name: THIRD-PARTY.md matches the lockfile
        entry: scripts/third-party.sh --check
        language: system
        files: ^(Cargo\.lock|Cargo\.toml|crates/.*/Cargo\.toml|THIRD-PARTY\.md)$
        pass_filenames: false
