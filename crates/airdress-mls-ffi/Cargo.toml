[package]
name = "airdress-mls-ffi"
version = "0.1.86"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Flutter Rust Bridge wrapper for mls-rs, exposing MLS operations to Dart"

[lib]
# `lib` (rlib) added so `airdress-operator` (federation feature) can
# reuse `credential.rs` — the delegation-carrying identity types — for
# the in-process agent's MLS credential. The cdylib/staticlib outputs
# for the Dart FFI build are unchanged.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
mls-rs.workspace = true
mls-rs-core.workspace = true
mls-rs-crypto-rustcrypto.workspace = true
ed25519-dalek.workspace = true
chacha20poly1305 = { workspace = true, features = ["rand_core"] }
# NOTE: serde_json's `preserve_order` feature must never be enabled —
# canonicalization (`canonical.rs`) relies on the default BTreeMap
# representation sorting object keys at every nesting level.
serde_json.workspace = true
base64.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
