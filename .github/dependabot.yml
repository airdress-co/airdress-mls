# Every `uses:` is pinned to a commit SHA, with the version in a trailing
# comment. Dependabot moves both together. Monthly and grouped, so a
# month's bumps cost one pull request and one CI run each, and a release
# younger than a week is left to settle first.
#
# Actions only. Cargo bumps stay a person's change: every lockfile move
# regenerates THIRD-PARTY.md (scripts/third-party.sh, checked in CI), and
# the mls-rs 0.x crates move together or not at all.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
