name: Extended checks

# The checks too heavy for every push (owner, 2026-11-03: "all extensive
# checks cannot run on every commit"): Miri, AddressSanitizer, a brief run
# of every fuzz target, mutation testing, and the Android and iOS
# cross-builds of the FFI library. They run nightly on main, on
# workflow_dispatch, and on a pull request labelled `full-ci` (the
# operator's convention: adding the label starts a run, a later push keeps
# it). None of them is a required check: a required check that does not
# run on a push would hold the merge forever. Every push still runs
# ci.yml; the long fuzz campaign is fuzz.yml.
on:
  schedule:
    - cron: "15 2 * * *"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    # The pure parsers, the sealed-record codec and the FFI's argument
    # checks under Miri (rust guide R-UNS-5). Anything that builds an MLS
    # engine or touches the filesystem is left out: Miri runs those in
    # hours, not minutes, and the raw-pointer paths are all in the
    # argument checks.
    name: Miri over the parsers and the FFI argument checks
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - name: airdress-mls parsers and record codec
        run: |
          cargo +nightly miri test --locked -p airdress-mls --lib -- \
            canonical::tests::maps_serialise_sorted_whatever_the_insertion_order \
            storage::tests::group_record_round_trip \
            credential::tests::legacy_bare_string_still_parses \
            credential::tests::json_object_without_a_version_is_legacy \
            credential::tests::versioned_object_with_bad_fields_is_an_error_not_legacy \
            credential::tests::rfc3339 \
            group_context::tests
      - name: airdress-mls-client lane payload codec
        run: |
          cargo +nightly miri test --locked -p airdress-mls-client --lib -- \
            wire::tests::the_object_form_round_trips_with_ref_and_reply \
            wire::tests::a_plain_message_carries_ref_and_no_reply \
            wire::tests::encode_refuses_what_it_could_not_decode \
            wire::tests::reply_to_serializes_without_nulls \
            wire::tests::a_malformed_reply_to_is_absent_and_the_message_still_decodes \
            wire::tests::unknown_keys_inside_reply_to_are_ignored
      - name: FFI argument checks and buffers
        run: |
          cargo +nightly miri test --locked -p airdress-mls-ffi --lib -- \
            ffi::tests::arguments_are_checked_before_they_are_read

  asan:
    # The FFI crate is where the unsafe code is (rust guide R-UNS-5). Miri
    # covers its argument checks; AddressSanitizer runs all of its tests,
    # including the paths Miri cannot (real allocation across the C ABI).
    name: AddressSanitizer over the FFI crate
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      # std is rebuilt with the sanitizer too (-Zbuild-std), so an overflow
      # in an alloc path reached across the FFI is seen, and the sanitized
      # crates never mix with an unsanitized std.
      - name: FFI tests under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
        run: cargo +nightly test --locked -Zbuild-std -p airdress-mls-ffi --lib --target x86_64-unknown-linux-gnu

  fuzz:
    # Every parser of bytes a peer or a disk chose has a target (rust
    # guide R-TST-3). CI builds them all and runs each briefly; a longer
    # run is `cargo +nightly fuzz run <target>` from fuzz/.
    name: Fuzz targets, built and run briefly
    # Nightly, fuzz.yml runs every target for minutes; this brief run is
    # for a labelled pull request or a dispatch.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-fuzz@0.13.2
      # The fuzz crate is its own workspace. Its lock is the root lock, so
      # the fuzzer tests the dependency versions that ship.
      - name: Use the workspace lock
        run: cp Cargo.lock fuzz/Cargo.lock
      - name: Build every target
        working-directory: fuzz
        # --target: the prebuilt cargo-fuzz is a musl binary and would
        # otherwise build for musl, where the sanitizer cannot link.
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
      - name: Run each for 30 seconds
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=30
          done

  cross-build:
    # build-native.sh, run as a person runs it, for the phone targets:
    # every Android ABI linked with the runner's NDK (ANDROID_NDK_HOME is
    # set on ubuntu runners), and the iOS static libraries, which need no
    # Apple linker and so build here; linking them into an app needs
    # Xcode, which this job does not attempt. The arm64 Android library
    # is then held to symbols.txt like the host one in ci.yml.
    name: Cross-build the FFI library for Android and iOS
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Android, every ABI
        run: crates/airdress-mls-ffi/build-native.sh android
      - name: iOS device and simulator static libraries
        run: crates/airdress-mls-ffi/build-native.sh ios
      - name: nm over the arm64 Android library equals symbols.txt
        run: scripts/check-symbols.sh crates/airdress-mls-ffi/build/android/jniLibs/arm64-v8a/libairdress_mls_ffi.so

  mutants:
    # Advisory: a surviving mutant is a test worth writing, not a merge
    # blocker. Only the code this pull request changes is mutated.
    name: Mutants on the diff (advisory)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutants on the changed code
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff "origin/${BASE_REF}...HEAD" > git.diff
          cargo mutants --in-diff git.diff --in-place --workspace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out
          path: mutants.out
          retention-days: 14
