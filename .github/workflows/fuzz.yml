name: Fuzz (nightly)

# Every parser of bytes a peer or a disk chose has a target (rust guide
# R-TST-3). ci.yml builds and runs each for 30 seconds on every change;
# this runs each for 4 minutes a night from a corpus kept in the Actions
# cache, so coverage accumulates night over night. Six targets are about
# 30 minutes in all.
#
# -O for speed, -a to keep debug assertions and overflow checks: an
# integer overflow in a decoder must crash, not wrap.
on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  targets:
    # The matrix is what fuzz/Cargo.toml declares, so a new target is
    # fuzzed nightly without anyone editing this file.
    name: List the targets
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          set -euo pipefail
          targets=$(sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -vx 'airdress-mls-fuzz' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: targets
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-fuzz@0.13.2
      # The fuzz crate is its own workspace. Its lock is the root lock, so
      # the fuzzer tests the dependency versions that ship.
      - name: Use the workspace lock
        run: cp Cargo.lock fuzz/Cargo.lock
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for 4 minutes
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "corpus/$TARGET"
          # --target: the prebuilt cargo-fuzz is a musl binary and would
          # otherwise build for musl, where the sanitizer cannot link.
          cargo +nightly fuzz run -O -a --target x86_64-unknown-linux-gnu "$TARGET" "corpus/$TARGET" -- \
            -max_total_time=240 -timeout=5 -rss_limit_mb=2048 -print_final_stats=1
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
