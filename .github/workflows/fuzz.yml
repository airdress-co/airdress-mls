name: Fuzz (nightly)

# Every parser of bytes a peer or a disk chose has a target (rust guide
# R-TST-3). ci.yml builds and runs each for 30 seconds on every change;
# this runs each for 4 minutes a night from a corpus kept in the Actions
# cache, so coverage accumulates night over night. Six targets are about
# 30 minutes in all.
#
# -O for speed, -a to keep debug assertions and overflow checks: an
# integer overflow in a decoder must crash, not wrap.
on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - group_extensions_decode
          - group_record_decode
          - lane_payload_decode
          - message_group_id
          - parse_identity
          - parse_rfc3339_seconds
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # The fuzz crate is its own workspace. Its lock is the root lock, so
      # the fuzzer tests the dependency versions that ship.
      - name: Use the workspace lock
        run: cp Cargo.lock fuzz/Cargo.lock
      - name: Restore the corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for 4 minutes
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "corpus/$TARGET"
          cargo +nightly fuzz run -O -a "$TARGET" "corpus/$TARGET" -- \
            -max_total_time=240 -timeout=5 -rss_limit_mb=2048 -print_final_stats=1
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
