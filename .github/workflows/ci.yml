name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, lint and test
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The hygiene scan reads every commit, not the tip, and SonarQube
          # decides what is new code from history and blame.
          fetch-depth: 0
          persist-credentials: false
      # rust-toolchain.toml pins the compiler; this installs it.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # No private dependency and no credential: every dependency is on
      # crates.io, which is what lets a public checkout build.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The engine is also built on its own (by the operator and the CLI),
      # where feature unification cannot hide a lint (rust guide R-LNT-2).
      - run: cargo clippy -p airdress-mls --all-targets --locked -- -D warnings
      - name: The FFI crate's lint block is the workspace's
        run: scripts/check-lints-copy.sh
      - name: ChaCha20's keystream state is wiped on drop
        # chacha20poly1305 0.10 (the sealed stores) always zeroizes its
        # own key and always turns on chacha20's `zeroize` feature; the
        # MLS provider's chacha20 gets it from the workspace's `chacha20`
        # entry. Every chacha20 in the graph is checked, so a release
        # that makes it optional, or a new copy, fails here.
        run: |
          set -euo pipefail
          versions=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "chacha20") | .version')
          [[ -n "$versions" ]] || { echo "::error::no chacha20 in the graph"; exit 1; }
          for v in $versions; do
            features=$(cargo tree --locked -e features -i "chacha20@$v" --prefix none)
            echo "$features" | grep -q '^chacha20 feature "zeroize"' \
              || { echo "$features"; echo "::error::chacha20 $v is built without zeroize"; exit 1; }
          done
      # The tests run once, instrumented: cargo-llvm-cov writes the LCOV
      # report SonarQube Cloud reads, so coverage costs no second run.
      - name: llvm-tools (coverage instrumentation)
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Tests (all three crates), with coverage
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      # cargo-llvm-cov runs doc tests only on nightly; run them plainly so
      # one added later is not silently skipped.
      - name: Doc tests
        run: cargo test --workspace --locked --doc
      - name: Docs build without a warning (rust guide R-LNT-5)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
      - name: Document numbers stay out of code
        run: scripts/check-doc-numbers.sh
      - name: No internal names, in the tree or the history
        run: |
          scripts/check-public.sh
          scripts/check-public.sh --history
      - name: THIRD-PARTY.md matches the lockfile
        run: scripts/third-party.sh --check
      # Only where the secret exists: a fork's PR has none, and skips it.
      - name: SonarQube Cloud token present?
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "enabled=${SONAR_TOKEN:+true}" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud analysis
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  abi:
    name: Vectors and FFI symbol parity
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Named, so a filter that stops matching shows up as "0 passed"
      # here rather than as a quietly shorter suite.
      - name: Delegation vectors (canonical bytes and signatures)
        run: |
          set -euo pipefail
          out=$(cargo test --locked -p airdress-mls --lib -- \
            canonical::tests:: \
            credential::tests:: delegation::tests:: 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -qE 'test result: ok\. [1-9][0-9]* passed' \
            || { echo "::error::the vector tests matched nothing"; exit 1; }
      - name: Client vectors and round trips (lane payload, commit group, two and three devices)
        run: |
          set -euo pipefail
          out=$(cargo test --locked -p airdress-mls-client --test client 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -qE 'test result: ok\. [1-9][0-9]* passed' \
            || { echo "::error::the client tests matched nothing"; exit 1; }
      - name: nm over the built library equals symbols.txt
        run: scripts/check-symbols.sh

  deny:
    name: Licences, advisories and the telemetry bans
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The pinned binary, not EmbarkStudios/cargo-deny-action: that
      # action runs in a container, and in airdress-cli its inability to
      # see the runner's git credential surfaced as a licence error.
      - name: Licences, advisories, bans and sources
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          tarball="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$tarball" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${tarball}"
          echo "${DENY_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" --strip-components=1 \
            "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          ./cargo-deny --all-features check licenses advisories bans sources

  semver:
    # The engine and the client crate are linked by the operator and the
    # CLI at a tag: an API break without a version bump fails here
    # (rust guide R-API-6). The FFI crate's Rust API is not its contract;
    # scripts/check-symbols.sh holds the C one.
    name: Semver against the last release
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: cargo-semver-checks, pinned binary
        env:
          SEMVER_CHECKS_VERSION: v0.51.0
          SEMVER_CHECKS_SHA256: 396c8508d973c83de52660943a057e971b586f7511c3ba695762373452b43d5b
        run: |
          set -euo pipefail
          tarball=cargo-semver-checks-x86_64-unknown-linux-musl.tar.gz
          curl --proto '=https' --tlsv1.2 -sSfL -o "$tarball" \
            "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/${SEMVER_CHECKS_VERSION}/${tarball}"
          echo "${SEMVER_CHECKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" cargo-semver-checks
      - name: Engine and client against the last release
        # Against the last tag, which is what consumers pin, not the base
        # revision: between releases main carries an unreleased version,
        # and two breaking changes inside one unreleased version are one
        # bump. Before the first tag, 0.2.0 at 5cf9036, which the
        # operator pins.
        run: |
          set -euo pipefail
          base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 5cf9036)
          echo "baseline: $base"
          for pkg in airdress-mls airdress-mls-client; do
            # A crate the baseline does not have has no API to break.
            if git cat-file -e "$base:crates/$pkg/Cargo.toml" 2>/dev/null; then
              ./cargo-semver-checks semver-checks -p "$pkg" --baseline-rev "$base"
            else
              echo "$pkg is new since $base; nothing to compare"
            fi
          done

  msrv:
    # rust-version is the one place the MSRV lives (rust guide R-API-7);
    # the pinned toolchain is newer, so this is the only build that sees
    # the oldest compiler a consumer may use.
    name: Build on the MSRV
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build with exactly rust-version
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --workspace --locked

  miri:
    # The pure parsers, the sealed-record codec and the FFI's argument
    # checks under Miri (rust guide R-UNS-5). Anything that builds an MLS
    # engine or touches the filesystem is left out: Miri runs those in
    # hours, not minutes, and the raw-pointer paths are all in the
    # argument checks.
    name: Miri over the parsers and the FFI argument checks
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - name: airdress-mls parsers and record codec
        run: |
          cargo +nightly miri test --locked -p airdress-mls --lib -- \
            canonical::tests::maps_serialise_sorted_whatever_the_insertion_order \
            storage::tests::group_record_round_trip \
            credential::tests::legacy_bare_string_still_parses \
            credential::tests::json_object_without_a_version_is_legacy \
            credential::tests::versioned_object_with_bad_fields_is_an_error_not_legacy \
            credential::tests::rfc3339 \
            group_context::tests
      - name: airdress-mls-client lane payload codec
        run: |
          cargo +nightly miri test --locked -p airdress-mls-client --lib -- \
            wire::tests::the_object_form_round_trips_with_ref_and_reply \
            wire::tests::a_plain_message_carries_ref_and_no_reply \
            wire::tests::encode_refuses_what_it_could_not_decode \
            wire::tests::reply_to_serializes_without_nulls \
            wire::tests::a_malformed_reply_to_is_absent_and_the_message_still_decodes \
            wire::tests::unknown_keys_inside_reply_to_are_ignored
      - name: FFI argument checks and buffers
        run: |
          cargo +nightly miri test --locked -p airdress-mls-ffi --lib -- \
            ffi::tests::arguments_are_checked_before_they_are_read

  fuzz:
    # Every parser of bytes a peer or a disk chose has a target (rust
    # guide R-TST-3). CI builds them all and runs each briefly; a longer
    # run is `cargo +nightly fuzz run <target>` from fuzz/.
    name: Fuzz targets, built and run briefly
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # The fuzz crate is its own workspace. Its lock is the root lock, so
      # the fuzzer tests the dependency versions that ship.
      - name: Use the workspace lock
        run: cp Cargo.lock fuzz/Cargo.lock
      - name: Build every target
        working-directory: fuzz
        run: cargo +nightly fuzz build
      - name: Run each for 30 seconds
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=30
          done

  asan:
    # The FFI crate is where the unsafe code is (rust guide R-UNS-5). Miri
    # covers its argument checks; AddressSanitizer runs all of its tests,
    # including the paths Miri cannot (real allocation across the C ABI).
    name: AddressSanitizer over the FFI crate
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - name: FFI tests under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
        run: cargo +nightly test --locked -p airdress-mls-ffi --lib --target x86_64-unknown-linux-gnu

  zizmor:
    name: Workflow audit (zizmor)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Public repository: findings go to the Security tab.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  mutants:
    # Advisory: a surviving mutant is a test worth writing, not a merge
    # blocker. Only the code this pull request changes is mutated.
    name: Mutants on the diff (advisory)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutants on the changed code
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff "origin/${BASE_REF}...HEAD" > git.diff
          cargo mutants --in-diff git.diff --in-place --workspace -- --lib
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutants-out
          path: mutants.out
          retention-days: 14
