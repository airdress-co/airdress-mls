# Pinned so that local and CI run the identical compiler — the same
# version airdress-operator pins, so a consumer building this crate in
# its own workspace sees the lints this repository's CI saw.
#
# Cross targets (Android, iOS) are added by `build-native.sh` from inside
# this directory, where rustup resolves this toolchain rather than the
# caller's default.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
