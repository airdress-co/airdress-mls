[workspace]
resolver = "3"
members = ["crates/airdress-mls", "crates/airdress-mls-ffi", "crates/airdress-mls-client"]
# The fuzz targets are their own workspace, built by `cargo fuzz` on nightly.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/airdress-co/airdress-mls"
publish = false

[workspace.dependencies]
# Each entry says what it is for (rust guide R-WS-4). Versions are caret
# ranges unless a comment says why a pin is load-bearing.

# The engine itself, for the FFI and client crates in this workspace.
airdress-mls = { path = "crates/airdress-mls", version = "0.4.0" }

# The RFC 9420 implementation everything here wraps. No default features:
# `std` plus the RFC-compliant extension set, and the faster codec.
mls-rs = { version = "0.54", default-features = false, features = ["std", "rfc_compliant", "fast_serialize"] }
# The storage and identity traits our sealed store and credential implement; must match mls-rs's.
mls-rs-core = { version = "0.26", default-features = false, features = ["std", "rfc_compliant", "fast_serialize"] }
# Pure-Rust crypto provider for ciphersuite 3 (X25519, ChaCha20-Poly1305, Ed25519): no C toolchain for the phone targets.
mls-rs-crypto-rustcrypto = "0.21"
# Root and session signatures over delegations; `zeroize` wipes the signing keys on drop.
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
# Seals group and key-package state at rest. 0.10 has no `zeroize`
# feature to turn on: it always wipes its key on drop and always enables
# `chacha20/zeroize` for the keystream state. CI asserts the latter with
# `cargo tree -e features`, so a release that makes it optional fails.
chacha20poly1305 = "0.10"
# Delegations are JSON and their signing bytes are canonical JSON.
# NOTE: serde_json's `preserve_order` feature must never be enabled —
# canonicalization (`canonical.rs`) relies on the default BTreeMap
# representation sorting object keys at every nesting level. Every
# consumer that links this crate shares one serde_json, so the ban holds
# for the consumer's whole graph too. `canonical.rs` has a test that
# fails if it leaks in (R-WS-6).
serde_json = "1"
# Keys and signatures travel as unpadded base64url inside delegations.
base64 = "0.22"
# Wipes secrets (seeds, state keys, group records) when they are dropped (R-TYP-8).
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# Test-only: a throwaway state directory per test.
tempfile = "3"
# The client crate's envelope wire types, and the engine's group context
# extension bodies.
serde = { version = "1", features = ["derive"] }
# The client crate's content digests.
sha2 = "0.10"

# The rust guide's section 3.11 block (R-LNT-1). Members inherit it with
# `[lints] workspace = true`; the FFI crate overrides `unsafe_code` and
# allows it on its one module (R-UNS-1).
[workspace.lints.rust]
unsafe_code = "forbid"                       # FFI crate overrides to "deny" and allows per module (R-UNS-1)
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unnameable_types = "warn"
elided_lifetimes_in_paths = "warn"
unused_qualifications = "warn"
unused_must_use = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "warn"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
map_err_ignore = "warn"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
iter_over_hash_type = "warn"
tests_outside_test_module = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
get_unwrap = "warn"
manual_let_else = "warn"
or_fun_call = "warn"
use_self = "warn"
str_to_string = "warn"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# --- pedantic allows, each with its reason ---
missing_errors_doc = "allow"                 # the error type documents itself; `# Errors` where it adds a fact
missing_panics_doc = "allow"                 # R-ERR-3 demands the reason at the `expect` instead
module_name_repetitions = "allow"            # `engine::EngineError` is the clearer name
must_use_candidate = "allow"                 # too noisy; `#[must_use]` is added where misuse has a cost
too_many_lines = "allow"                     # a long match over a closed enum is not a defect
doc_markdown = "allow"                       # acronyms (MLS, AAD, FFI) are not items to backtick
cast_possible_truncation = "allow"           # we require `try_from` at wire edges by review
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
