# SonarQube Cloud, run from CI (the "Build, lint and test" job in ci.yml),
# not Automatic Analysis: only a CI scan can import coverage. The two are
# exclusive, so Automatic Analysis is off for this project.
sonar.projectKey=airdress-co_airdress-mls
sonar.organization=airdress-co

# Integration tests and fuzz targets are tests, not source: cargo-llvm-cov
# leaves them out of lcov.info, so counting them as source would show them
# uncovered and fail new code on the gate. (Unit tests are inline modules
# in the source files and cannot be split this way.)
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=crates/*/tests/**,fuzz/**
sonar.exclusions=target/**,fuzz/**,crates/*/tests/**,lcov.info,vectors/**

# Written by `cargo llvm-cov --lcov` in the same job.
sonar.rust.lcov.reportPaths=lcov.info

# The Rust analyzer runs clippy itself unless told not to. CI already runs
# clippy with -D warnings, twice (the workspace, and the engine alone), so a
# third run would only rebuild for findings CI has refused already.
# SonarQube's own Rust rules still run.
sonar.rust.clippy.enabled=false
